<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ResumeForge Pro | Product Manager Resume Builder</title>
    <!-- html2pdf bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 30px 24px;
            color: #1a2c3e;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');

        .app-container {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 28px;
        }

        .editor-panel {
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            overflow-y: auto;
            max-height: 90vh;
            padding: 24px 26px;
            scrollbar-width: thin;
        }

        .preview-panel {
            background: #fefefe;
            border-radius: 28px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            padding: 28px 30px;
            position: sticky;
            top: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .section-card {
            background: #f9fafc;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 24px;
            border: 1px solid #e6edf2;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f3b5c;
            border-left: 4px solid #2b7a62;
            padding-left: 12px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        label {
            font-weight: 600;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 5px;
            color: #2c4e6e;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #cfdfe8;
            background: white;
            font-family: inherit;
            font-size: 0.9rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2b7a62;
            box-shadow: 0 0 0 3px rgba(43, 122, 98, 0.2);
        }

        .dynamic-item {
            background: white;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 18px;
            border: 1px solid #e2eaf0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .dynamic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #bc6f5c;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-primary {
            background: #2b7a62;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #1f5e4b;
        }

        .btn-download {
            background: #1f4e6e;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        .small-btn {
            background: #eef3f7;
            border: 1px solid #cbdde6;
            border-radius: 40px;
            padding: 8px 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .add-input-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        /* preview styling */
        .resume-preview {
            font-family: 'Inter', sans-serif;
            color: #1c2e3a;
        }

        .preview-name {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #143b4b;
        }

        .preview-profile {
            background: #f0f6fa;
            padding: 14px 18px;
            border-radius: 18px;
            margin: 16px 0;
            font-size: 0.9rem;
            line-height: 1.45;
            border-left: 4px solid #2b7a62;
        }

        .preview-section {
            margin-top: 24px;
        }

        .preview-section h3 {
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 3px solid #dce9f0;
            padding-bottom: 6px;
            margin-bottom: 14px;
            display: inline-block;
            color: #1c5a6e;
        }

        .degree-card, .cert-card {
            background: #f9fdfe;
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #2b7a62;
        }

        .degree-title, .cert-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .degree-meta, .cert-meta {
            font-size: 0.75rem;
            color: #4f6f8a;
            margin-top: 5px;
        }

        .skill-tag {
            background: #eef2f5;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-right: 6px;
            margin-bottom: 8px;
        }

        .project-item, .exp-item {
            margin-bottom: 18px;
        }

        .project-title, .exp-title {
            font-weight: 700;
            font-size: 1rem;
            color: #0f4b5c;
        }

        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .preview-panel {
                position: relative;
                top: 0;
            }
            body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- LEFT: EDITOR -->
    <div class="editor-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h2 style="font-weight: 700; color: #1c5a6e;"><i class="fas fa-user-edit"></i> Resume Manager</h2>
            <button id="resetDemoBtn" class="small-btn"><i class="fas fa-undo-alt"></i> Load Demo</button>
        </div>
        <p style="font-size: 0.8rem; margin-bottom: 20px;">Add / Edit / Delete any section — live preview + PDF export (data never vanishes)</p>

        <!-- Name -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-user"></i> Full Name</div>
            <input type="text" id="nameInput" placeholder="Full name" value="Jordan M. Chen">
        </div>

        <!-- Profile -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-address-card"></i> Professional Profile</div>
            <textarea id="profileInput" rows="3" placeholder="Short bio / summary">Strategic Product Manager with proven track record in data-driven roadmap execution, cross-functional leadership, and launching 0→1 products. Passionate about AI-driven solutions and user-centric design.</textarea>
        </div>

        <!-- Degrees: institute, startYear, endYear (or Present), cgpa -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-graduation-cap"></i> Degrees</div>
            <div id="degreesListEditor"></div>
            <button id="addDegreeBtn" class="btn-primary" style="width:100%;"><i class="fas fa-plus-circle"></i> Add Degree</button>
        </div>

        <!-- Certifications: name + issuing institute/platform -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-certificate"></i> Certifications</div>
            <div id="certsListEditor"></div>
            <button id="addCertBtn" class="btn-primary" style="width:100%;"><i class="fas fa-plus-circle"></i> Add Certification</button>
        </div>

        <!-- Skills (Core, Supportive) and Tools remain similar but simplified chips -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-code-branch"></i> Core Skills</div>
            <div id="coreSkillsContainer" class="skill-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;"></div>
            <div class="add-input-group">
                <input type="text" id="newCoreSkillInput" placeholder="e.g., Product Strategy">
                <button id="addCoreSkillBtn" class="small-btn">+ Add</button>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title"><i class="fas fa-hand-sparkles"></i> Supportive Skills</div>
            <div id="supportiveSkillsContainer" class="skill-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;"></div>
            <div class="add-input-group">
                <input type="text" id="newSupportiveSkillInput" placeholder="e.g., Stakeholder management">
                <button id="addSupportiveSkillBtn" class="small-btn">+ Add</button>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title"><i class="fas fa-tools"></i> Tools Expertise</div>
            <div id="toolsContainer" class="skill-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;"></div>
            <div class="add-input-group">
                <input type="text" id="newToolInput" placeholder="e.g., Jira, Figma">
                <button id="addToolBtn" class="small-btn">+ Add</button>
            </div>
        </div>

        <!-- Projects (Product & Case Studies) -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-project-diagram"></i> Product & Case Studies</div>
            <div id="projectsListEditor"></div>
            <button id="addProjectBtn" class="btn-primary" style="width:100%;"><i class="fas fa-plus-circle"></i> Add Project / Case Study</button>
        </div>

        <!-- Experience -->
        <div class="section-card">
            <div class="section-title"><i class="fas fa-briefcase"></i> Professional Experience</div>
            <div id="experienceListEditor"></div>
            <button id="addExperienceBtn" class="btn-primary" style="width:100%;"><i class="fas fa-plus-circle"></i> Add Experience</button>
        </div>

        <button id="downloadPDFBtn" class="btn-primary btn-download"><i class="fas fa-file-pdf"></i> Download as Professional PDF</button>
    </div>

    <!-- RIGHT: PREVIEW -->
    <div class="preview-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h3><i class="fas fa-eye"></i> Live Resume Preview</h3>
            <span style="font-size: 0.7rem; background:#eef2f5; padding: 4px 10px; border-radius: 20px;">export ready</span>
        </div>
        <div id="resumePreview" class="resume-preview"></div>
    </div>
</div>

<script>
    // ------------------- STATE (enhanced degrees & certs) ------------------
    let state = {
        name: "Jordan M. Chen",
        profile: "Strategic Product Manager with proven track record in data-driven roadmap execution, cross-functional leadership, and launching 0→1 products. Passionate about AI-driven solutions and user-centric design.",
        degrees: [
            { institute: "UC Berkeley, Haas School of Business", degreeName: "MBA, Product Leadership", startYear: "2021", endYear: "2023", cgpa: "3.9/4.0" },
            { institute: "University of Washington", degreeName: "B.S. Information Systems", startYear: "2015", endYear: "2019", cgpa: "3.7/4.0" }
        ],
        certifications: [
            { name: "Certified Scrum Product Owner (CSPO)", issuer: "Scrum Alliance", year: "2022" },
            { name: "PMP Certification", issuer: "PMI", year: "2023" },
            { name: "AI Product Management", issuer: "Stanford Online", year: "2024" }
        ],
        coreSkills: ["Product Roadmapping", "User Research", "Data Analytics", "Go-to-Market Strategy"],
        supportiveSkills: ["Agile Leadership", "Cross-functional Collaboration", "Storytelling", "Negotiation"],
        toolsExpertise: ["Jira", "Figma", "Amplitude", "Notion", "SQL"],
        projects: [
            { title: "AI-driven Analytics Platform", description: "Led product discovery & MVP launch resulting in 35% increase in user engagement. Conducted 20+ customer interviews, defined KPIs, collaborated with ML engineers." },
            { title: "Omni-channel CRM Redesign", description: "Case study: Revamped legacy CRM, improved retention by 28% within 6 months. Prioritized features via RICE scoring and A/B testing." }
        ],
        experiences: [
            { title: "Senior Product Manager", company: "Nexify Tech", period: "2022 – Present", description: "Own product lifecycle for AI analytics suite; increased ARR by $2.4M. Launched 3 major features based on user insights." },
            { title: "Associate Product Manager", company: "GrowthLabs", period: "2020 – 2022", description: "Managed cross-functional teams, led user story mapping and sprint planning. Drove UX research initiatives that boosted NPS by 22 pts." }
        ]
    };

    // Helper to render everything
    function fullRender() {
        renderDegreesEditor();
        renderCertsEditor();
        renderCoreSkillsChips();
        renderSupportiveSkillsChips();
        renderToolsChips();
        renderProjectsEditor();
        renderExperienceEditor();
        renderPreview();
        // sync name & profile inputs
        document.getElementById("nameInput").value = state.name;
        document.getElementById("profileInput").value = state.profile;
    }

    // ---------- Degrees Editor (dynamic cards with institute, degree name, start, end, cgpa) ----------
    function renderDegreesEditor() {
        const container = document.getElementById("degreesListEditor");
        if (!container) return;
        container.innerHTML = "";
        state.degrees.forEach((deg, idx) => {
            const div = document.createElement("div");
            div.className = "dynamic-item";
            div.innerHTML = `
                <div class="dynamic-header">
                    <strong>🎓 ${escapeHtml(deg.degreeName || 'Degree')}</strong>
                    <button class="remove-btn" data-degree-index="${idx}"><i class="fas fa-trash-alt"></i> Remove</button>
                </div>
                <div class="field-group"><label>Degree / Program Name</label><input type="text" class="deg-name" data-degree-index="${idx}" value="${escapeHtml(deg.degreeName)}" placeholder="e.g., MBA, Product Management"></div>
                <div class="field-group"><label>Institute / University</label><input type="text" class="deg-institute" data-degree-index="${idx}" value="${escapeHtml(deg.institute)}" placeholder="University name"></div>
                <div class="field-group" style="display:flex; gap:10px; flex-wrap:wrap;"><div style="flex:1"><label>Start Year</label><input type="text" class="deg-start" data-degree-index="${idx}" value="${escapeHtml(deg.startYear)}" placeholder="2020"></div><div style="flex:1"><label>End Year / Present</label><input type="text" class="deg-end" data-degree-index="${idx}" value="${escapeHtml(deg.endYear)}" placeholder="2024 or Present"></div><div style="flex:1"><label>CGPA / Grade</label><input type="text" class="deg-cgpa" data-degree-index="${idx}" value="${escapeHtml(deg.cgpa)}" placeholder="3.8/4.0"></div></div>
            `;
            container.appendChild(div);
        });
        attachDegreeEvents();
        attachRemoveDegreeEvents();
    }

    function attachDegreeEvents() {
        document.querySelectorAll('.deg-name, .deg-institute, .deg-start, .deg-end, .deg-cgpa').forEach(el => {
            el.removeEventListener('input', handleDegreeChange);
            el.addEventListener('input', handleDegreeChange);
        });
    }
    function handleDegreeChange(e) {
        const idx = parseInt(e.target.dataset.degreeIndex);
        if (isNaN(idx)) return;
        const field = e.target.classList.contains('deg-name') ? 'degreeName' :
                      e.target.classList.contains('deg-institute') ? 'institute' :
                      e.target.classList.contains('deg-start') ? 'startYear' :
                      e.target.classList.contains('deg-end') ? 'endYear' : 'cgpa';
        if (state.degrees[idx]) {
            state.degrees[idx][field] = e.target.value;
            renderPreview();
        }
    }
    function attachRemoveDegreeEvents() {
        document.querySelectorAll('[data-degree-index].remove-btn').forEach(btn => {
            btn.removeEventListener('click', removeDegreeHandler);
            btn.addEventListener('click', removeDegreeHandler);
        });
    }
    function removeDegreeHandler(e) {
        const idx = parseInt(e.currentTarget.dataset.degreeIndex);
        if (!isNaN(idx)) {
            state.degrees.splice(idx, 1);
            fullRender();
        }
    }

    // ---------- Certifications Editor (name + issuer + year) ----------
    function renderCertsEditor() {
        const container = document.getElementById("certsListEditor");
        if (!container) return;
        container.innerHTML = "";
        state.certifications.forEach((cert, idx) => {
            const div = document.createElement("div");
            div.className = "dynamic-item";
            div.innerHTML = `
                <div class="dynamic-header">
                    <strong>📜 ${escapeHtml(cert.name) || 'Certification'}</strong>
                    <button class="remove-btn" data-cert-index="${idx}"><i class="fas fa-trash-alt"></i> Remove</button>
                </div>
                <div class="field-group"><label>Certification Name</label><input type="text" class="cert-name" data-cert-index="${idx}" value="${escapeHtml(cert.name)}" placeholder="e.g., CSPO"></div>
                <div class="field-group"><label>Issuing Institute / Platform</label><input type="text" class="cert-issuer" data-cert-index="${idx}" value="${escapeHtml(cert.issuer)}" placeholder="Scrum Alliance, Coursera, etc."></div>
                <div class="field-group"><label>Year Earned</label><input type="text" class="cert-year" data-cert-index="${idx}" value="${escapeHtml(cert.year)}" placeholder="2023"></div>
            `;
            container.appendChild(div);
        });
        attachCertEvents();
        attachRemoveCertEvents();
    }
    function attachCertEvents() {
        document.querySelectorAll('.cert-name, .cert-issuer, .cert-year').forEach(el => {
            el.removeEventListener('input', handleCertChange);
            el.addEventListener('input', handleCertChange);
        });
    }
    function handleCertChange(e) {
        const idx = parseInt(e.target.dataset.certIndex);
        if (isNaN(idx)) return;
        const field = e.target.classList.contains('cert-name') ? 'name' :
                      e.target.classList.contains('cert-issuer') ? 'issuer' : 'year';
        if (state.certifications[idx]) {
            state.certifications[idx][field] = e.target.value;
            renderPreview();
        }
    }
    function attachRemoveCertEvents() {
        document.querySelectorAll('[data-cert-index].remove-btn').forEach(btn => {
            btn.removeEventListener('click', removeCertHandler);
            btn.addEventListener('click', removeCertHandler);
        });
    }
    function removeCertHandler(e) {
        const idx = parseInt(e.currentTarget.dataset.certIndex);
        if (!isNaN(idx)) {
            state.certifications.splice(idx, 1);
            fullRender();
        }
    }

    // Skills (chip based)
    function renderCoreSkillsChips() { renderChipList("coreSkillsContainer", state.coreSkills, "coreSkill"); }
    function renderSupportiveSkillsChips() { renderChipList("supportiveSkillsContainer", state.supportiveSkills, "supportiveSkill"); }
    function renderToolsChips() { renderChipList("toolsContainer", state.toolsExpertise, "tool"); }
    function renderChipList(containerId, arr, type) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = arr.map((item, idx) => `<span class="skill-tag">${escapeHtml(item)} <i class="fas fa-times-circle" style="margin-left:6px; cursor:pointer;" data-type="${type}" data-index="${idx}"></i></span>`).join('');
        document.querySelectorAll(`#${containerId} .fa-times-circle`).forEach(icon => {
            icon.removeEventListener('click', chipRemoveHandler);
            icon.addEventListener('click', chipRemoveHandler);
        });
    }
    function chipRemoveHandler(e) {
        const target = e.currentTarget;
        const type = target.dataset.type;
        const idx = parseInt(target.dataset.index);
        if (type === 'coreSkill') state.coreSkills.splice(idx,1);
        else if (type === 'supportiveSkill') state.supportiveSkills.splice(idx,1);
        else if (type === 'tool') state.toolsExpertise.splice(idx,1);
        fullRender();
    }
    function addCoreSkill() { const val = document.getElementById('newCoreSkillInput').value.trim(); if(val){ state.coreSkills.push(val); document.getElementById('newCoreSkillInput').value=''; fullRender(); } }
    function addSupportiveSkill() { const val = document.getElementById('newSupportiveSkillInput').value.trim(); if(val){ state.supportiveSkills.push(val); document.getElementById('newSupportiveSkillInput').value=''; fullRender(); } }
    function addTool() { const val = document.getElementById('newToolInput').value.trim(); if(val){ state.toolsExpertise.push(val); document.getElementById('newToolInput').value=''; fullRender(); } }

    // Projects Editor (existing)
    function renderProjectsEditor() {
        const container = document.getElementById("projectsListEditor");
        if(!container) return;
        container.innerHTML = '';
        state.projects.forEach((proj, idx) => {
            const div = document.createElement('div'); div.className = 'dynamic-item';
            div.innerHTML = `<div class="dynamic-header"><strong>📌 ${escapeHtml(proj.title)}</strong><button class="remove-btn" data-project-index="${idx}"><i class="fas fa-trash-alt"></i> Remove</button></div>
                <div class="field-group"><label>Project / Case Study Title</label><input type="text" class="project-title-input" data-project-index="${idx}" value="${escapeHtml(proj.title)}"></div>
                <div class="field-group"><label>Description (Insights, metrics)</label><textarea class="project-desc-input" data-project-index="${idx}" rows="2">${escapeHtml(proj.description)}</textarea></div>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.project-title-input').forEach(inp => inp.addEventListener('input', (e) => { let i = parseInt(inp.dataset.projectIndex); if(state.projects[i]) state.projects[i].title = inp.value; renderPreview(); }));
        document.querySelectorAll('.project-desc-input').forEach(ta => ta.addEventListener('input', (e) => { let i = parseInt(ta.dataset.projectIndex); if(state.projects[i]) state.projects[i].description = ta.value; renderPreview(); }));
        document.querySelectorAll('.remove-btn[data-project-index]').forEach(btn => btn.addEventListener('click', (e) => { let i = parseInt(btn.dataset.projectIndex); state.projects.splice(i,1); fullRender(); }));
    }
    function addProject() { state.projects.push({ title: "New Product Case", description: "Describe problem, solution, outcome." }); fullRender(); }

    // Experience Editor
    function renderExperienceEditor() {
        const container = document.getElementById("experienceListEditor");
        if(!container) return;
        container.innerHTML = '';
        state.experiences.forEach((exp, idx) => {
            const div = document.createElement('div'); div.className = 'dynamic-item';
            div.innerHTML = `<div class="dynamic-header"><strong>💼 ${escapeHtml(exp.title)}</strong><button class="remove-btn" data-exp-index="${idx}"><i class="fas fa-trash-alt"></i> Remove</button></div>
                <div class="field-group"><label>Job Title</label><input class="exp-title-inp" data-exp-index="${idx}" value="${escapeHtml(exp.title)}"></div>
                <div class="field-group"><label>Company</label><input class="exp-company-inp" data-exp-index="${idx}" value="${escapeHtml(exp.company)}"></div>
                <div class="field-group"><label>Period</label><input class="exp-period-inp" data-exp-index="${idx}" value="${escapeHtml(exp.period)}"></div>
                <div class="field-group"><label>Description</label><textarea class="exp-desc-inp" rows="2" data-exp-index="${idx}">${escapeHtml(exp.description)}</textarea></div>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.exp-title-inp').forEach(inp => inp.addEventListener('input', (e) => { let i = parseInt(inp.dataset.expIndex); if(state.experiences[i]) state.experiences[i].title = inp.value; renderPreview(); }));
        document.querySelectorAll('.exp-company-inp').forEach(inp => inp.addEventListener('input', (e) => { let i = parseInt(inp.dataset.expIndex); if(state.experiences[i]) state.experiences[i].company = inp.value; renderPreview(); }));
        document.querySelectorAll('.exp-period-inp').forEach(inp => inp.addEventListener('input', (e) => { let i = parseInt(inp.dataset.expIndex); if(state.experiences[i]) state.experiences[i].period = inp.value; renderPreview(); }));
        document.querySelectorAll('.exp-desc-inp').forEach(ta => ta.addEventListener('input', (e) => { let i = parseInt(ta.dataset.expIndex); if(state.experiences[i]) state.experiences[i].description = ta.value; renderPreview(); }));
        document.querySelectorAll('.remove-btn[data-exp-index]').forEach(btn => btn.addEventListener('click', (e) => { let i = parseInt(btn.dataset.expIndex); state.experiences.splice(i,1); fullRender(); }));
    }
    function addExperience() { state.experiences.push({ title: "Product Manager", company: "Company Name", period: "2024 – Present", description: "Key accomplishments." }); fullRender(); }

    // Preview render with new degree & cert structure
    function renderPreview() {
        const previewDiv = document.getElementById("resumePreview");
        const degreesHtml = state.degrees.map(d => `<div class="degree-card"><div class="degree-title">${escapeHtml(d.degreeName)}</div><div class="degree-meta">${escapeHtml(d.institute)} | ${escapeHtml(d.startYear)} – ${escapeHtml(d.endYear)} | CGPA: ${escapeHtml(d.cgpa)}</div></div>`).join('');
        const certsHtml = state.certifications.map(c => `<div class="cert-card"><div class="cert-title">${escapeHtml(c.name)}</div><div class="cert-meta">${escapeHtml(c.issuer)}${c.year ? ` · ${c.year}` : ''}</div></div>`).join('');
        const coreSkillsHtml = state.coreSkills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('');
        const supportiveSkillsHtml = state.supportiveSkills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('');
        const toolsHtml = state.toolsExpertise.map(t => `<span class="skill-tag">${escapeHtml(t)}</span>`).join('');
        const projectsHtml = state.projects.map(p => `<div class="project-item"><div class="project-title">📌 ${escapeHtml(p.title)}</div><div class="project-desc" style="font-size:0.85rem; margin-top:4px;">${escapeHtml(p.description)}</div></div>`).join('');
        const expHtml = state.experiences.map(e => `<div class="exp-item"><div class="exp-title">💼 ${escapeHtml(e.title)} · ${escapeHtml(e.company)}</div><div class="exp-meta" style="font-size:0.75rem; color:#5f7f95;">${escapeHtml(e.period)}</div><div class="exp-desc" style="font-size:0.85rem;">${escapeHtml(e.description)}</div></div>`).join('');
        previewDiv.innerHTML = `
            <div class="preview-name">${escapeHtml(state.name)}</div>
            <div class="preview-profile">${escapeHtml(state.profile)}</div>
            <div class="preview-section"><h3>🎓 Education</h3>${degreesHtml || '<div>—</div>'}</div>
            <div class="preview-section"><h3>📜 Certifications</h3>${certsHtml || '<div>—</div>'}</div>
            <div class="preview-section"><h3>⚙️ Core Skills</h3><div>${coreSkillsHtml || '—'}</div></div>
            <div class="preview-section"><h3>🤝 Supportive Skills</h3><div>${supportiveSkillsHtml || '—'}</div></div>
            <div class="preview-section"><h3>🛠️ Tools Expertise</h3><div>${toolsHtml || '—'}</div></div>
            <div class="preview-section"><h3>📘 Product & Case Studies</h3>${projectsHtml || '<div>—</div>'}</div>
            <div class="preview-section"><h3>💼 Experience</h3>${expHtml || '<div>—</div>'}</div>
        `;
    }

    // Sync name+profile from inputs
    function syncBasic() {
        state.name = document.getElementById("nameInput").value;
        state.profile = document.getElementById("profileInput").value;
        renderPreview();
    }

    // Download PDF
    function downloadPDF() {
        const element = document.getElementById("resumePreview");
        html2pdf().set({ margin: [0.5,0.5,0.5,0.5], filename: 'Product_Resume.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).from(element).save();
    }

    // Reset Demo
    function resetDemo() {
        state = {
            name: "Jordan M. Chen",
            profile: "Strategic Product Manager with proven track record in data-driven roadmap execution, cross-functional leadership, and launching 0→1 products. Passionate about AI-driven solutions and user-centric design.",
            degrees: [
                { institute: "UC Berkeley, Haas School of Business", degreeName: "MBA, Product Leadership", startYear: "2021", endYear: "2023", cgpa: "3.9/4.0" },
                { institute: "University of Washington", degreeName: "B.S. Information Systems", startYear: "2015", endYear: "2019", cgpa: "3.7/4.0" }
            ],
            certifications: [
                { name: "Certified Scrum Product Owner (CSPO)", issuer: "Scrum Alliance", year: "2022" },
                { name: "PMP Certification", issuer: "PMI", year: "2023" },
                { name: "AI Product Management", issuer: "Stanford Online", year: "2024" }
            ],
            coreSkills: ["Product Roadmapping", "User Research", "Data Analytics", "Go-to-Market Strategy"],
            supportiveSkills: ["Agile Leadership", "Cross-functional Collaboration", "Storytelling", "Negotiation"],
            toolsExpertise: ["Jira", "Figma", "Amplitude", "Notion", "SQL"],
            projects: [
                { title: "AI-driven Analytics Platform", description: "Led product discovery & MVP launch resulting in 35% increase in user engagement. Conducted 20+ customer interviews, defined KPIs, collaborated with ML engineers." },
                { title: "Omni-channel CRM Redesign", description: "Case study: Revamped legacy CRM, improved retention by 28% within 6 months. Prioritized features via RICE scoring and A/B testing." }
            ],
            experiences: [
                { title: "Senior Product Manager", company: "Nexify Tech", period: "2022 – Present", description: "Own product lifecycle for AI analytics suite; increased ARR by $2.4M. Launched 3 major features based on user insights." },
                { title: "Associate Product Manager", company: "GrowthLabs", period: "2020 – 2022", description: "Managed cross-functional teams, led user story mapping and sprint planning. Drove UX research initiatives that boosted NPS by 22 pts." }
            ]
        };
        fullRender();
    }

    // Event bindings
    document.getElementById("nameInput").addEventListener("input", syncBasic);
    document.getElementById("profileInput").addEventListener("input", syncBasic);
    document.getElementById("addDegreeBtn").addEventListener("click", () => { state.degrees.push({ institute: "", degreeName: "New Degree", startYear: "", endYear: "", cgpa: "" }); fullRender(); });
    document.getElementById("addCertBtn").addEventListener("click", () => { state.certifications.push({ name: "New Certification", issuer: "", year: "" }); fullRender(); });
    document.getElementById("addCoreSkillBtn").addEventListener("click", addCoreSkill);
    document.getElementById("addSupportiveSkillBtn").addEventListener("click", addSupportiveSkill);
    document.getElementById("addToolBtn").addEventListener("click", addTool);
    document.getElementById("addProjectBtn").addEventListener("click", addProject);
    document.getElementById("addExperienceBtn").addEventListener("click", addExperience);
    document.getElementById("downloadPDFBtn").addEventListener("click", downloadPDF);
    document.getElementById("resetDemoBtn").addEventListener("click", resetDemo);

    // initial load
    fullRender();
</script>
</body>
</html>
